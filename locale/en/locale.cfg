[mod-setting-description]
beshineis_tracers--deviation_coef_reduction_per_quality_level=Reduces deviations for guns and turrets with quality above normal.\nAffects [color=blue]__3__[/color] and [color=blue]__4__[/color]\n[img=utility/warning_icon]Note: doesn't work with [color=blue]__1__[/color]=[font=default-bold]__2__[/font] for now

beshineis_tracers--speed_deviation=Maximum speed variation for fired bullets.\nIn tiles per tick. 1 second = 60 ticks.
beshineis_tracers--range_deviation=Total range variation. Bullets distance will be within [color=yellow]baseBulletRange ⋅ (1±(½⋅value))[/color]\nImitates vertical deviation.\nCoefficient.
beshineis_tracers--angle_deviation=Total 'horizontal' spread. Fired bullet angle will deviate from shot direction for at most [color=yellow]±½⋅value[/color]\nIn degrees.

beshineis_tracers--special_entity_deviation_coef=Scale deviations per entity basis.\nMake sniper precise again.\n[color=yellow]Entity1:0.15;Entity2:0;Entity%d+:1.25[/color]\n[img=utility/warning_icon]Note: Ignored if [color=blue]__1__[/color]=[font=default-bold]__2__[/font]\nCan be defined as a pattern, but must not contain symbols [font=default-bold]:[/font] or [font=default-bold];[/font]\nIf exact match was found - pattern recognition won't be used.
beshineis_tracers--minimal_bullet_range=The minimal distance in tiles bullet will travel even for turrets/weapons with shorter range.\nDoesn't account for [color=blue]__3__[/color], only base range considered.\nIf [color=blue]__1__[/color]=[font=default-bold]__2__[/font] then defines bullet range for all bullet weapons.\n[img=utility/warning_icon]Note: if bullet range is lower then turret range, it will still fire, event if bullets unable to reach target.
beshineis_tracers--collision_scale=Hitbox of the bullets
beshineis_tracers--player_targeting=Player targeting mode. Changes how mod affects player-fired weapons.
beshineis_tracers--prediction_overshoot_ticks=Applies to player only when player lead target is active. Allows to add time offset for target leading.\nOffsets target position along target's predicted path according to target's current speed.\nIn game ticks.
beshineis_tracers--magazine_size_modifier=Scales magazine capacity by the specified amount. When using misfires, or even worse: directional targeting, i suggest you set this to be above 1.5.

beshineis_tracers--mode_of_operation=Specifies how this mod will work. Read options for more information.


beshineis_tracers--resistance_tree_flat=Reduce incoming damage by that amount. If result damage is 0 or negative - it will be ignored.
beshineis_tracers--resistance_tree_percent=Reduce incoming damage by that percent.
beshineis_tracers--resistance_rock_flat=Reduce incoming damage by that amount. If result damage is 0 or negative - it will be ignored.
beshineis_tracers--resistance_rock_percent=Reduce incoming damage by that percent.
beshineis_tracers--resistance_stompershell_flat=Reduce incoming damage by that amount. If result damage is 0 or negative - it will be ignored.
beshineis_tracers--resistance_stompershell_percent=Reduce incoming damage by that percent.

