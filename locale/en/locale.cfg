[mod-setting-description]
beshineis_tracers--speed_deviation=Maximum speed variation for fired bullets.\nIn tiles per tick. 1 second = 60 ticks.
beshineis_tracers--range_deviation=Total range variation. Bullets distance will be within [color=yellow]baseBulletRange ⋅ (1±(½⋅value))[/color]\nImitates vertical deviation.\nCoefficient.
beshineis_tracers--angle_deviation=Total 'horizontal' spread. Fired bullet angle will deviate from shot direction for at most [color=yellow]±½⋅value[/color]\nIn degrees.

beshineis_tracers--special_entity_deviation_coef=Scale deviations per entity basis.\nMake sniper precise again.\n[color=yellow]Entity1:0.15;Entity2:0;Entity%d+:1.25[/color]\nNote: Ignored if [color=blue]__1__[/color]=[font=default-bold]__2__[/font]\nCan be defined as a pattern, but must not contain symbols [font=default-bold]:[/font] or [font=default-bold];[/font]\nIf exact match was found - pattern recognition won't be used.
beshineis_tracers--minimal_bullet_range=The minimal distance in tiles bullet will travel even for turrets/weapons with shorter range.\nDoesn't account for [color=blue]__3__[/color], only base range considered.\nIf [color=blue]__1__[/color]=[font=default-bold]__2__[/font] then defines bullet range for all bullet weapons.\nNote: if bullet range is lower then turret range, it will still fire, event if bullets unable to reach target.
beshineis_tracers--collision_scale=Hitbox of the bullets
beshineis_tracers--player_targeting=Player targeting mode. Changes how mod affects player-fired weapons.
beshineis_tracers--player_lead_target=When using misfires without directional targeting, this allows you to hit enemies that move diagonal to you.\nunfortunately this introduces a bug making your character ignore the max range
beshineis_tracers--prediction_overshoot_ticks=Applies to player only when player lead target is active. Allows to add time offset for target leading.\nOffsets target position along target's predicted path according to target's current speed.\nIn game ticks.
beshineis_tracers--magazine_size_modifier=Scales magazine capacity by the specified amount. When using misfires, or even worse: directional targeting, i suggest you set this to be above 1.5.

beshineis_tracers--mode_of_operation=Specifies how this mod will work. Read options for more information.

[string-mod-setting]
beshineis_tracers--mode_of_operation-unified=Unified
beshineis_tracers--mode_of_operation-projectile_spawner=Lua
beshineis_tracers--mode_of_operation-hidden_turret=Prototype

beshineis_tracers--player_targeting-directional=Directional
beshineis_tracers--player_targeting-entity_leading=Leading
beshineis_tracers--player_targeting-entity=Entity
beshineis_tracers--player_targeting-vanilla=Vanilla

[string-mod-setting-description]
beshineis_tracers--mode_of_operation-unified=Unifies bullet range accross all ammo shooting entities to be the "Minimal bullet fly range".\nDoesn't affect targeting range!\nSome settings are ignored.\nCheapest for performance
beshineis_tracers--mode_of_operation-projectile_spawner=Each entity spawns unique projectiles from lua.\nMay be expensive if a lot of shooting happens simultaneously.
beshineis_tracers--mode_of_operation-hidden_turret=Each applicable entity recieves hidden entity that will shoot on its behalve.\nMay create a lot of additional entity prototypes.\nNot implemented yet.

beshineis_tracers--player_targeting-directional=Play the game like a twinstick shooter
beshineis_tracers--player_targeting-entity_leading=Will try to predict position of targeted entity and fire in that direction.\nBest works with [color=blue]Mode of operation[/color]=[font=default-bold]Unified[/font]
beshineis_tracers--player_targeting-entity=No alterations to targeting. Bullet will fly into targeted enemy.\nNote: bullets are still need time to travel, and you can't compensate for that.
beshineis_tracers--player_targeting-vanilla=Kepp player owned guns without changes to targeting.
