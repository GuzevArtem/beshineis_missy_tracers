[string-mod-setting-description]
beshineis_tracers--mode_of_operation-unified=Unifies bullet range accross all ammo shooting entities to be the "Minimal bullet fly range".\nDoesn't affect targeting range!\nSome settings are ignored.\nCheapest for performance
beshineis_tracers--mode_of_operation-projectile_spawner=Each entity spawns unique projectiles from lua.\nMay be expensive if a lot of shooting happens simultaneously.
beshineis_tracers--mode_of_operation-hidden_turret=Each applicable entity recieves hidden companion entity that will shoot on its behalf.\nMay create a lot of additional entity prototypes.\nNot implemented yet.

beshineis_tracers--player_targeting-directional=Play the game like a twinstick shooter
beshineis_tracers--player_targeting-entity_leading=Will try to predict position of targeted entity and fire in that direction.\nBest works with [color=blue]Mode of operation[/color]=[font=default-bold]Unified[/font]
beshineis_tracers--player_targeting-entity=No alterations to targeting. Bullet will fly into targeted enemy.\n[img=utility/warning_icon]Note: bullets still have time to travel, and you can't compensate for that.
beshineis_tracers--player_targeting-vanilla=Keep character handled guns without changes.
